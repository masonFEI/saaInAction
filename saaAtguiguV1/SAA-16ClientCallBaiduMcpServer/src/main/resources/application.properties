server.port=8016
# 大模型对话中文乱码UTF8编码处理
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.servlet.encoding.charset=UTF-8
spring.application.name=SAA-16ClientCallBaiduMcpServer
# ================ SpringAIAlibaba Config =====================
spring.ai.dashscope.api-key=
# ================ mcp-client config =====================
spring.ai.mcp.client.request-timeout=60s
spring.ai.mcp.client.toolcallback.enabled=true
# 百度地图 MCP 是 stdio 进程（npx 拉起），必须用 stdio.servers-configuration 指向配置文件
# 注意：不能用 sse.connections.*.url，那里的 url 是真实 HTTP 地址，不是 classpath 资源
spring.ai.mcp.client.stdio.servers-configuration=classpath:/mcp-server.json5